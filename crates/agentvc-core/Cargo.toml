[package]
name = "agentvc-core"
description = "Store, attempt model and copy-on-write views for agentvc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
flate2 = "1.1.11"
hex = "0.4.3"
ignore = "0.4.30"
libc = "0.2.191"
reflink-copy = "0.1.33"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
thiserror = "2.0.21"
ureq = "3.5.2"

[dev-dependencies]
tempfile = "3.27.0"
