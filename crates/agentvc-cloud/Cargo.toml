[package]
name = "agentvc-cloud"
description = "Hosted agentvc review UI: relays the UI to daemons that dial out, stores no code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "agentvc-cloud"
path = "src/main.rs"

[dependencies]
agentvc-core.workspace = true
anyhow = "1.0.105"
axum = { version = "0.8", features = ["ws", "form", "query"] }
clap = { version = "4.5.61", features = ["derive", "env"] }
getrandom = "0.3"
hex = "0.4.3"
mime_guess = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
ureq = { version = "3.5.2", features = ["json"] }

[dev-dependencies]
futures-util = "0.3"
agentvcd = { path = "../agentvcd" }
tempfile = "3.27.0"
tokio-tungstenite = "0.28"
