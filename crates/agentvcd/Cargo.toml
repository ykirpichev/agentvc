[package]
name = "agentvcd"
description = "Local daemon for agentvc: JSON API, live events and the review UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "agentvcd"
path = "src/main.rs"

[dependencies]
agentvc-core.workspace = true
anyhow = "1.0.105"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5.61", features = ["derive"] }
mime_guess = "2"
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tempfile = "3.27.0"
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }
