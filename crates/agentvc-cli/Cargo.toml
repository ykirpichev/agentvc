[package]
name = "agentvc-cli"
description = "Command-line interface for agentvc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "agentvc"
path = "src/main.rs"

[dependencies]
agentvc-core.workspace = true
anyhow = "1.0.105"
clap = { version = "4.5.61", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.1.2"
tempfile = "3.27.0"
