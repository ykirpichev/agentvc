# The hosted service on one VM: agentvc-cloud behind Caddy, which serves HTTPS
# with a Let's Encrypt certificate. Values come from /etc/agentvc-cloud.env
# (see agentvc-cloud.env.example). For a Cloudflare Tunnel instead of Caddy,
# see docker-compose.tunnel.yml.
# 2.4: Debian 12's docker-compose 1.29 needs a version; Compose v2 ignores it.
version: "2.4"
services:
  agentvc-cloud:
    image: ${AGENTVC_CLOUD_IMAGE:-ghcr.io/ykirpichev/agentvc-cloud:latest}
    restart: unless-stopped
    env_file: /etc/agentvc-cloud.env
    environment:
      AGENTVC_CLOUD_LISTEN: 0.0.0.0:8080
      AGENTVC_CLOUD_DATA: /data
    volumes:
      - /var/lib/agentvc-cloud:/data
    # 1 GB VM: leave room for the OS and Caddy.
    mem_limit: 384m

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    env_file: /etc/agentvc-cloud.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/caddy:/data
    mem_limit: 128m
    depends_on: [agentvc-cloud]
