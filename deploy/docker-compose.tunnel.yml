# Alternative: reach the service through a Cloudflare Tunnel, so the VM opens
# no inbound port at all. Needs a domain on Cloudflare and TUNNEL_TOKEN in
# /etc/agentvc-cloud.env; route the tunnel's hostname to
# http://agentvc-cloud:8080. Use it instead of the caddy service:
#   docker-compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d agentvc-cloud cloudflared
# 2.4: Debian 12's docker-compose 1.29 needs a version; Compose v2 ignores it.
version: "2.4"
services:
  cloudflared:
    # Pin a version from https://hub.docker.com/r/cloudflare/cloudflared/tags.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: /etc/agentvc-cloud.env
    mem_limit: 128m
    depends_on: [agentvc-cloud]
