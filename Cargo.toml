[workspace]
resolver = "2"
members = ["crates/agentvc-core", "crates/agentvc-cli", "crates/agentvc-mcp", "crates/agentvcd", "crates/agentvc-cloud"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
agentvc-core = { path = "crates/agentvc-core" }
agentvc-mcp = { path = "crates/agentvc-mcp" }
