[workspace]
resolver = "2"
members = ["crates/agentvc-core", "crates/agentvc-cli", "crates/agentvc-mcp", "crates/agentvcd"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
agentvc-core = { path = "crates/agentvc-core" }
agentvc-mcp = { path = "crates/agentvc-mcp" }
