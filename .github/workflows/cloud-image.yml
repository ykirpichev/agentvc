name: Cloud image
# Builds the agentvc-cloud container on PRs that touch it. Publishing to
# ghcr.io only happens when someone runs this workflow by hand with push on.
on:
  pull_request:
    paths:
      - Dockerfile.cloud
      - crates/agentvc-cloud/**
      - crates/agentvc-core/src/relay.rs
      - deploy/**
      - .github/workflows/cloud-image.yml
  workflow_dispatch:
    inputs:
      push:
        description: Publish the image to ghcr.io (agentvc-cloud package)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ inputs.push }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloud
          push: ${{ inputs.push == true }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentvc-cloud:latest
            ghcr.io/${{ github.repository_owner }}/agentvc-cloud:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
