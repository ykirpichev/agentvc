name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    # macOS forks use APFS clonefile; Windows uses the copy backend. The
    # overlayfs tests are Linux-only (`cfg(target_os = "linux")`) and are
    # skipped elsewhere by design, as the step below says.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings and links as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false && git config --global core.symlinks true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Overlay tests
        if: runner.os != 'Linux'
        run: echo "overlayfs is Linux-only; its tests are compiled out on ${{ runner.os }} (forks here use ${{ runner.os == 'macOS' && 'clonefile' || 'copy' }})"
      # APFS numbers for docs/design.md: this checkout with its warm target/.
      - name: Fork benchmark (#7)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p agentvc-cli
          git config --global user.name ci && git config --global user.email ci@example.com
          scripts/bench-fork.sh "$PWD" 3
      - run: integrations/claude-code/tests/plugin.sh
        if: runner.os == 'Linux'
      - run: scripts/package-skills.py
        if: runner.os == 'Linux'

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: The Claude Code pane's copy of the shared UI code is current
        run: sh ../integrations/claude-desktop/sync-shared.sh --check

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build agentvc and agentvcd for the extension tests
        working-directory: .
        run: cargo build -p agentvc-cli -p agentvcd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - uses: actions/cache@v4
        with:
          path: integrations/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-stable
      - name: Extension tests (@vscode/test-electron)
        run: xvfb-run -a npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: agentvc-vsix
          path: integrations/vscode/agentvc.vsix
